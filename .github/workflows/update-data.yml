name: Update verified economic data
on:
  schedule:
    # Every 30 minutes during US release hours, including DST shifts.
    - cron: '7,37 12-19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-economic-data
  cancel-in-progress: false
jobs:
  update:
    # Explicit activation after review. A PR branch cannot change production data.
    if: github.ref == 'refs/heads/main' && vars.AUTO_DATA_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Fetch and validate licensed releases
        run: npm run update-data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
      - run: npm run validate-data
      - name: Commit only the validated public snapshot
        run: |
          if git diff --quiet -- data/economic-data.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic-data.json
          git commit -m "data: refresh verified US economic releases"
          git push origin HEAD:main
